name: AddressSanitizer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out RDKit
        uses: actions/checkout@6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang-18 \
            libclang-rt-18-dev \
            llvm-18 \
            ninja-build \
            libboost-all-dev \
            libcairo2-dev \
            libeigen3-dev \
            libfreetype6-dev \
            python3-dev \
            python3-matplotlib \
            python3-numpy \
            python3-pandas \
            python3-pil \
            python3-pytest

      - name: Configure
        run: |
          cmake -S . -B build/asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_C_FLAGS="-fsanitize=address,pointer-compare,pointer-subtract -fsanitize-address-use-after-scope -fno-omit-frame-pointer -fno-optimize-sibling-calls" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,pointer-compare,pointer-subtract -fsanitize-address-use-after-scope -fno-omit-frame-pointer -fno-optimize-sibling-calls" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,pointer-compare,pointer-subtract -shared-libsan" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,pointer-compare,pointer-subtract -shared-libsan" \
            -DPython_EXECUTABLE=/usr/bin/python3 \
            -DRDK_BUILD_CPP_TESTS=ON \
            -DRDK_BUILD_PYTHON_WRAPPERS=ON \
            -DRDK_BUILD_CAIRO_SUPPORT=ON \
            -DRDK_BUILD_FREETYPE_SUPPORT=ON \
            -DRDK_INSTALL_INTREE=ON \
            -DRDK_INSTALL_STATIC_LIBS=OFF

      - name: Build
        run: cmake --build build/asan --parallel 4 --target install

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:check_initialization_order=1:detect_invalid_pointer_pairs=0:suppressions=${{ github.workspace }}/Code/Sanitizers/asan.supp
          LD_LIBRARY_PATH: ${{ github.workspace }}/lib
          LLVM_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-18
          PYTHONPATH: ${{ github.workspace }}
          RDBASE: ${{ github.workspace }}
        run: |
          asan_runtime=$(clang++-18 --print-file-name=libclang_rt.asan-x86_64.so)
          test -f "$asan_runtime"
          export LD_PRELOAD="$asan_runtime"
          ctest --test-dir build/asan \
            --parallel 4 \
            --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/build/asan-results.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@7.0.1
        with:
          name: asan-results-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/asan-results.xml
            build/asan/Testing/Temporary/LastTest.log
